<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#145F5A">
<meta name="description" content="لوحة تواصل بديل ومعزّز بالعربية لمرضى حبسة بروكا">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جملتي بالصور">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>جُمْلَتي بالصُّوَر – تواصل بروكا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<style>
/* Layout: one-screen AAC board — fixed sentence strip on top (5 Fitzgerald-coloured slots, RTL), scrollable picture library below. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface2:#E2E8E7; --ink:#15232A; --ink2:#51636A; --line:#C9D3D1;
  --accent:#145F5A; --accent2:#0E4B47; --accent-ink:#FFFFFF; --danger:#B9372B; --danger-ink:#FFFFFF; --ok:#2B7A4B;
  /* modified Fitzgerald key used in AAC boards */
  --who:#B98A10; --act:#2B8352; --obj:#C3621C; --where:#2C68A8; --when:#76509F; --say:#A9446D;
  --whoT:#FBF2D8; --actT:#E2F2E8; --objT:#FBE9DA; --whereT:#E0EAF6; --whenT:#EDE5F5; --sayT:#F7E3EB;
  --shadow:0 1px 2px rgba(20,40,40,.08),0 2px 8px rgba(20,40,40,.06);
  --f-disp:"Noto Kufi Arabic","Segoe UI","Geeza Pro",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI","Geeza Pro",Tahoma,Arial,sans-serif;
  --tile:150px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#172225; --surface2:#203034; --ink:#E6EEEC; --ink2:#9DB0B3; --line:#2F4246;
  --accent:#3FB3A8; --accent2:#5CC7BC; --accent-ink:#06201E; --danger:#E0594C; --danger-ink:#1A0604; --ok:#5CC48A;
  --who:#E2B437; --act:#4FBF82; --obj:#EE8A45; --where:#5B9BE0; --when:#A889D4; --say:#D9789E;
  --whoT:#2D2611; --actT:#132B1E; --objT:#2F1D10; --whereT:#13233A; --whenT:#241B33; --sayT:#2E1622;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#172225; --surface2:#203034; --ink:#E6EEEC; --ink2:#9DB0B3; --line:#2F4246;
  --accent:#3FB3A8; --accent2:#5CC7BC; --accent-ink:#06201E; --danger:#E0594C; --danger-ink:#1A0604; --ok:#5CC48A;
  --who:#E2B437; --act:#4FBF82; --obj:#EE8A45; --where:#5B9BE0; --when:#A889D4; --say:#D9789E;
  --whoT:#2D2611; --actT:#132B1E; --objT:#2F1D10; --whereT:#13233A; --whenT:#241B33; --sayT:#2E1622;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr);max-width:1500px;margin:0 auto}
.k-who{--c:var(--who);--t:var(--whoT)} .k-act{--c:var(--act);--t:var(--actT)} .k-obj{--c:var(--obj);--t:var(--objT)}
.k-where{--c:var(--where);--t:var(--whereT)} .k-when{--c:var(--when);--t:var(--whenT)} .k-say{--c:var(--say);--t:var(--sayT)}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:10px 16px 8px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark i{display:block;width:7px;height:16px;border-radius:2px;margin:0 1px;background:var(--accent-ink)}
.brand .mark span{display:flex;align-items:flex-end}
.brand .mark span i:nth-child(1){height:10px;opacity:.7}.brand .mark span i:nth-child(3){height:12px;opacity:.85}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brand small{display:block;color:var(--ink2);font-size:12.5px;font-weight:500}
.brand .txt{min-width:0}
.q{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;font-weight:700;font-size:17px;border:2px solid transparent;min-height:46px}
.q.yes{background:var(--actT);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.q.no{background:var(--objT);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.q.sos{background:var(--danger);color:var(--danger-ink)}
.ib{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);position:relative}
.ib:hover{background:var(--surface2)}
.ib.on{background:var(--accent);color:var(--accent-ink)}

/* sentence strip */
.bar{background:var(--surface);border-block:1px solid var(--line);padding:12px 16px;box-shadow:var(--shadow)}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.slot{position:relative;min-height:118px;border:2px dashed color-mix(in srgb,var(--c) 55%,var(--line));border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;background:color-mix(in srgb,var(--t) 45%,var(--surface));min-width:0}
.slot .qq{font-weight:700;color:var(--c);font-size:17px}
.slot .hh{font-size:13px;color:var(--ink2)}
.slot.filled{border-style:solid;border-color:var(--c);background:var(--t)}
.slot.next{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.slot .pic{width:100%;height:60px;display:grid;place-items:center}
.slot .pic img{height:60px;width:60px;object-fit:cover;border-radius:10px}
.slot .pic .emo{font-size:44px;line-height:1}
.slot .pic svg.body{height:60px;width:60px;color:var(--ink)}
.slot .lb{font-weight:700;font-size:15px;text-align:center;line-height:1.25;max-width:100%;overflow-wrap:anywhere}
.slot .tag{position:absolute;top:4px;inset-inline-start:8px;font-size:11px;font-weight:700;color:var(--c)}
.mv{position:absolute;bottom:4px;display:flex;gap:4px;inset-inline:4px;justify-content:space-between}
.mv button{width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.mv button svg{width:18px;height:18px}
.sentence{font-size:24px;font-weight:700;line-height:1.5;min-height:1.5em;margin:10px 2px 10px;text-wrap:balance}
.sentence.empty{color:var(--ink2);font-weight:500;font-size:17px}
.bar.speaking .sentence{color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:74px;padding:6px 8px;border-radius:12px;background:var(--surface2);font-size:13px;font-weight:600;min-height:58px}
.act:hover{background:color-mix(in srgb,var(--surface2) 70%,var(--line))}
.act.on{background:var(--accent);color:var(--accent-ink)}
.act.speak{flex:1 1 220px;flex-direction:row;gap:10px;background:var(--accent);color:var(--accent-ink);font-size:21px;font-weight:700;font-family:var(--f-disp)}
.act.speak:hover{background:var(--accent2)}
.act.speak svg{width:30px;height:30px}

/* main area */
main{overflow:auto;padding:16px 16px 40px;min-height:0}
.crumb{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.crumb h2{font-family:var(--f-disp);font-weight:800;font-size:22px;margin:0;flex:1;min-width:0;text-wrap:balance}
.crumb .gi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--g) 18%,var(--surface))}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;background:var(--surface2);font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dan{background:var(--danger);color:var(--danger-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
h3.sec{font-size:15px;font-weight:700;color:var(--ink2);margin:22px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
h3.sec:first-of-type{margin-top:4px}
h3.sec i{width:12px;height:12px;border-radius:3px;background:var(--c);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:12px}
.tile{position:relative;aspect-ratio:1/1.08;max-width:100%;border-radius:16px;border:2px solid color-mix(in srgb,var(--c) 70%,transparent);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 10px;box-shadow:var(--shadow);transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .pic{flex:1;width:100%;min-height:0;display:grid;place-items:center;overflow:hidden;border-radius:10px}
.tile .pic img{width:100%;height:100%;object-fit:cover}
.tile .pic .emo{font-size:calc(var(--tile) * .4);line-height:1}
.tile .pic svg.body{height:100%;max-height:calc(var(--tile)*.62);color:var(--ink)}
.tile .lbl{font-weight:700;font-size:17px;text-align:center;line-height:1.25;overflow-wrap:anywhere}
.tile.say{background:var(--t)}
.tile.sos{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.tile.hid{opacity:.45;border-style:dashed}
.tile .badge{position:absolute;top:6px;inset-inline-start:6px;font-size:11px;font-weight:700;background:var(--surface2);border-radius:6px;padding:1px 6px}
.tile .rec{position:absolute;top:6px;inset-inline-end:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tile .rec svg{width:13px;height:13px}
.tile.add{border:2px dashed var(--line);box-shadow:none;background:transparent;color:var(--ink2);justify-content:center}
.tile.add svg{width:40px;height:40px}
body.notext .tile .lbl, body.notext .slot .lb{display:none}
body.notext .tile .pic .emo{font-size:calc(var(--tile) * .5)}
.edit .tile:not(.add)::after{content:"";position:absolute;inset:-2px;border-radius:16px;border:2px dashed var(--accent);pointer-events:none}

.gtile{border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:14px;box-shadow:var(--shadow);min-height:84px;text-align:start;position:relative}
.gtile .gi{width:56px;height:56px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--g) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--g) 55%,transparent)}
.gtile .gi img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.gtile .gi{overflow:hidden}
.gtile b{font-size:18px;font-weight:700;line-height:1.3;display:block}
.gtile small{color:var(--ink2);font-size:13px}
.gtile.hid{opacity:.45}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hint{color:var(--ink2);font-size:14px;line-height:1.6;max-width:70ch;margin:0 0 12px}

/* sentence cards (favourites/history) */
.slist{display:grid;gap:10px;max-width:980px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.scard .mini{display:flex;gap:6px;flex-wrap:wrap}
.scard .mini span{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:28px;background:var(--t);border:2px solid var(--c);overflow:hidden}
.scard .mini img{width:100%;height:100%;object-fit:cover}
.scard .mini svg.body{width:40px;height:40px;color:var(--ink)}
.scard .st{flex:1 1 220px;min-width:0;font-size:19px;font-weight:700;line-height:1.4}
.scard .ops{display:flex;gap:6px}
.empty-st{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--ink2);max-width:640px;line-height:1.7}

/* settings */
.set{max-width:760px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h4{margin:0 0 10px;font-size:17px;font-family:var(--f-disp);font-weight:800}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;flex-wrap:wrap}
.row label{flex:1;min-width:180px;font-weight:600}
.row small{display:block;color:var(--ink2);font-weight:400;font-size:13px}
input[type=text],input[type=password],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;max-width:100%}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.sw{width:54px;height:32px;border-radius:20px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s}
.sw.on{background:var(--accent)} .sw.on::after{inset-inline-start:25px}
.warn{background:color-mix(in srgb,var(--who) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--who) 50%,transparent);border-radius:12px;padding:12px 14px;line-height:1.6;font-size:14.5px}

/* modal */
.mback{position:fixed;inset:0;background:rgba(8,18,20,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;width:min(600px,100%);max-height:92%;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{font-family:var(--f-disp);font-weight:800;font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.modal h3 span{flex:1}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld > span{font-weight:700;font-size:14.5px}
.fld input,.fld select{width:100%}
.prev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prev .pv{width:96px;height:96px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;font-size:56px;overflow:hidden;background:var(--bg)}
.prev .pv img{width:100%;height:100%;object-fit:cover}
.prev .pv svg.body{width:80px;height:80px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:14px;display:inline-flex;gap:4px;align-items:center}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.mfoot div{display:flex;gap:8px;flex-wrap:wrap}
.pin{font-size:28px;letter-spacing:10px;text-align:center;width:100%}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}

#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.flash{animation:fl .6s}
@keyframes fl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

body.sz-s{--tile:120px} body.sz-l{--tile:190px}
@media (max-width:760px){
  .brand small{display:none}
  .top .lbl-hide{display:none}
  .q{padding:8px 10px;font-size:16px}
}
@media (max-width:560px){
  :root{--tile:108px}
  body.sz-s{--tile:92px} body.sz-l{--tile:140px}
  .top{gap:4px;padding:8px 12px 6px}
  .brand b{font-size:16px}
  .brand .mark{display:none}
  .ib{width:40px;height:40px}
  .bar{padding:10px 12px}
  main{padding:12px 12px 40px}
  .slots{gap:5px}
  .slot{min-height:88px;padding:6px 2px;border-radius:11px}
  .slot .pic{height:40px}.slot .pic img,.slot .pic svg.body{height:40px;width:40px}.slot .pic .emo{font-size:30px}
  .slot .qq{font-size:14px}.slot .hh{display:none}.slot .lb{font-size:12.5px}.slot .tag{display:none}
  .sentence{font-size:19px;margin:8px 2px}
  .acts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
  .act{min-width:0;font-size:10.5px;padding:4px 2px;min-height:50px}
  .act.speak{grid-column:1/-1;font-size:19px;min-height:54px}
  .tile .lbl{font-size:14.5px}
  .tile{padding:6px;border-radius:13px}
  .ggrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .gtile{flex-direction:column;text-align:center;gap:6px;padding:10px 6px;min-height:0}
  .gtile b{font-size:15px}.gtile small{display:none}
}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true"><span><i></i><i></i><i></i></span></div>
      <div class="txt"><b>جُمْلَتي بالصُّوَر</b><small>تواصل بروكا · لوحة تواصل بديل ومعزّز</small></div></div>
    <button class="q yes" data-say="نعم" aria-label="نعم">✓ <span>نعم</span></button>
    <button class="q no" data-say="لا" aria-label="لا">✕ <span>لا</span></button>
    <button class="q sos" id="sosBtn" aria-label="الحالات الطارئة">!<span class="lbl-hide">طوارئ</span></button>
    <button class="ib" id="favBtn" title="الجمل المفضلة" aria-label="الجمل المفضلة"></button>
    <button class="ib" id="editBtn" title="وضع المعالج (تعديل)" aria-label="وضع المعالج"></button>
    <button class="ib" id="setBtn" title="الإعدادات" aria-label="الإعدادات"></button>
  </header>
  <section class="bar" id="bar" aria-label="شريط تكوين الجملة">
    <div class="slots" id="slots"></div>
    <div class="sentence" id="sentence" aria-live="polite"></div>
    <div class="acts" id="acts"></div>
  </section>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'u')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------------- icons ---------------- */
const IC={
 speak:'M4 9h4l5-4v14l-5-4H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11',
 undo:'M9 5h11v14H9l-6-7z M12 9l5 6 M17 9l-5 6',
 trash:'M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13',
 order:'M7 4v16 M3 8l4-4 4 4 M17 20V4 M13 16l4 4 4-4',

const Store={db:null,mem:{},

   try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}catch(e){this.db=null}},
 async get(k){if(!this.db)return this.mem[k];try{return await new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return this.mem[k]}},
 async set(k,v){this.mem[k]=v;if(!this.db)return false;try{await new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});return true}catch(e){return false}}
};

/* ---------------- grammar ---------------- */
const PRE=['أ','ت','ت','ي','ت','ن','ي'];
function subjPr(it){ if(!it) return 0; if(it.person) return it.g==='f'?4:3; return it.pr!=null?it.pr:0 }
function verbForm(v,pr,obj){
 if(v.fixed) return v.t;
 if(v.imp){const f=(pr===2||pr===4)?v.f:(pr===6?v.p:v.m);return f+(v.rest?' '+v.rest:'')}
 let forms=v.forms; if(v.fforms&&obj&&obj.g==='f') forms=v.fforms;
 let w;
 if(forms) w=forms[pr];
 else if(pr===0) w=v.w;
 else{let st=v.stem,suf='';if(pr===2||pr===6){if(/[يى]$/.test(st))st=st.slice(0,-1);suf=pr===2?'ين':'ون'}w=PRE[pr]+st+suf}
 return (v.neg?v.neg+' ':'')+w+(v.rest?' '+v.rest:'');
}
const wordOf=it=>it.person?(it.name||it.t):(it.slot==='act'&&!it.fixed&&!it.custom?it.t.replace(/ (بـ|إلى|مع|من)$/,''):it.t);
function compose(state,order){
 state=state||ST;order=order||ORDER;
 const S={};for(const k in state) S[k]=state[k]?ITEM[state[k]]:null;
 const v=S.act, pr=subjPr(S.who), out={};
 if(S.who){ if(v&&v.imp) out.who=S.who.person?'يا '+(S.who.name||S.who.t)+'،':''; else out.who=S.who.person?(S.who.name||S.who.t):S.who.t }
 if(v) out.act=verbForm(v,pr,S.obj);
 if(S.obj){let t=S.obj.person?(S.obj.name||S.obj.t):S.obj.t;const op=v&&v.op;if(op==='بـ')t='ب'+t;else if(op)t=op+' '+t;out.obj=t}
 if(S.where){const own=S.where.prep==null?'في':S.where.prep;const pp=(own!==''&&v&&v.to!=null)?v.to:own;out.where=pp?pp+' '+S.where.t:S.where.t}
 if(S.when) out.when=S.when.t;
 const text=order.map(k=>out[k]).filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
 const segs=order.filter(k=>out[k]||(S[k]&&S[k].audio)).map(k=>({text:out[k],audio:S[k]&&S[k].audio}));
 return {S,text,segs};
}

/* ---------------- speech ---------------- */
let VOICES=[], curAudio=null;
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}catch(e){VOICES=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=()=>{loadVoices();if(VIEW.t==='settings')render()}}catch(e){}}
function stopAll(){try{speechSynthesis.cancel()}catch(e){} if(curAudio){try{curAudio.pause()}catch(e){} curAudio=null}}
function tts(text,done){
 if(!text){done&&done();return}
 if(!('speechSynthesis' in window)){toast('هذا المتصفح لا يدعم النطق الآلي');done&&done();return}
 const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';
 const v=VOICES.find(x=>x.voiceURI===SET.voice)||VOICES.find(x=>/SA|DZ|EG/i.test(x.lang))||VOICES[0];
 if(v){u.voice=v;u.lang=v.lang}
 u.rate=SET.rate||0.9;u.pitch=1;
 let fin=false;const end=()=>{if(!fin){fin=true;done&&done()}};
 u.onend=end;u.onerror=end;
 speechSynthesis.speak(u);
}
function playSegs(segs,onDone){
 stopAll();let i=0;
 const next=()=>{ if(i>=segs.length){onDone&&onDone();return}
  const s=segs[i++];
  if(s.audio){const a=new Audio(s.audio);curAudio=a;a.onended=next;a.onerror=()=>tts(s.text,next);a.play().catch(()=>tts(s.text,next))}
  else tts(s.text,next) };
 next();
}
function speakItem(it){
 if(it.audio) playSegs([{audio:it.audio,text:wordOf(it)}]);
 else {stopAll();tts(it.slot==='say'?it.t:wordOf(it))}
}

 if(ST[k]) STACK=STACK.filter(x=>x!==k);

function stateKey(st,order){return order.map(k=>st[k]||'').join('|')}

 HIST=HIST.filter(x=>(x.say||stateKey(x.st,x.order))!==key);

function resizeImage(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,hh=im.height;const s=Math.min(1,max/Math.max(w,hh));w=Math.round(w*s);hh=Math.round(hh*s);const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(im,0,0,w,hh);res(c.toDataURL('image/jpeg',.85))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
const fileToData=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});

async function startRec(){
 try{
  if(!navigator.mediaDevices||!window.MediaRecorder) throw 0;
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const rec=new MediaRecorder(stream);const chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=async()=>{const b=new Blob(chunks,{type:rec.mimeType||'audio/webm'});DRAFT.audio=await fileToData(b);stream.getTracks().forEach(t=>t.stop());REC=null;$('#e_audio').innerHTML=audioCtl()};
  REC={rec,stream};rec.start();$('#e_audio').innerHTML=audioCtl();
 }catch(e){toast('لا يمكن استعمال الميكروفون هنا. اختر «ملف صوتي» بدلًا من ذلك.')}
}

 if(ds.erestore!==undefined){delete USER.items[DRAFT.id];save(['user']);rebuild();closeModal();render();toast('أُعيدت الصورة الأصلية');return}
 if(ds.gsave!==undefined){saveGroup();return}
 if(ds.gdel!==undefined){const s=$('#delTxt');if(s.dataset.c){delete USER.groups[DRAFT.id];Object.values(USER.items).forEach(r=>{if(r.cats)r.cats=r.cats.filter(c=>c!==DRAFT.id)});save(['user']);rebuild();closeModal();go({t:'home'})}else{s.dataset.c=1;s.textContent='تأكيد حذف المجموعة'}return}
 if(ds.pinok!==undefined){if($('#pinChk').value===SET.pin){const cb=pinCb;pinCb=null;closeModal();cb&&cb()}else{toast('الرمز غير صحيح');$('#pinChk').value=''}return}
 if(ds.lspeak!==undefined){const L=ds.kind==='favs'?FAVS:HIST,f=L[+ds.lspeak];if(!f)return;
   if(f.say){speakItem(ITEM[f.say])}else{const c=compose(f.st,f.order);playSegs(c.segs.length?c.segs:[{text:c.text}])}return}
 if(ds.luse!==undefined){const L=ds.kind==='favs'?FAVS:HIST;loadSentence(L[+ds.luse]);return}
 if(ds.ldel!==undefined){FAVS.splice(+ds.ldel,1);save(['favs']);render();return}
 if(ds.lfav!==undefined){const f=HIST[+ds.lfav];if(f&&!f.say){const key=stateKey(f.st,f.order);if(!FAVS.some(x=>stateKey(x.st,x.order)===key)){FAVS.unshift(Object.assign({},f));save(['favs'])}toast('حُفظت في المفضلة')}else toast('العبارات الجاهزة موجودة دائمًا في مجموعتها');return}
 if(ds.clearhist!==undefined){HIST=[];save(['hist']);render();return}
 if(ds.testvoice!==undefined){stopAll();tts('أنا أريد شرب الماء في المطبخ الآن');return}
 if(ds.export!==undefined){exportData();return}
 if(ds.reset!==undefined){
   if(!t.dataset.c){t.dataset.c=1;t.querySelector('span').textContent='اضغط مرة أخرى للتأكيد: سيُحذف كل شيء';return}
   USER={items:{},groups:{},usage:{}};FAVS=[];HIST=[];SET={showText:true,size:'m',speakTap:true,rate:0.9,voice:'',pin:'',theme:''};save();rebuild();editMode=false;go({t:'home'});toast('أُعيد ضبط التطبيق');return}
});
function stopRec_keep(){ if(REC&&REC.rec.state!=='inactive'){REC.rec.stop()} }
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='e_img'&&t.files[0]){try{readDraftFields();DRAFT.img=await resizeImage(t.files[0],520);drawItemEditor()}catch(er){toast('تعذّرت قراءة الصورة')}}
 if(t.id==='e_aud'&&t.files[0]){if(t.files[0].size>3e6){toast('الملف كبير؛ اختر تسجيلًا أقصر من دقيقة');return}DRAFT.audio=await fileToData(t.files[0]);$('#e_audio').innerHTML=audioCtl()}
 if(t.id==='e_rel'){const R=relInfo(t.value);if(R){DRAFT.rel=R[0];DRAFT.g=R[2];$('#e_t').value=R[1];if(!DRAFT.img&&(!DRAFT.e||DRAFT.e==='👤'))DRAFT.e=R[3];readDraftFields();drawItemEditor()}else{DRAFT.rel='أخرى'}}
 if(t.id==='voiceSel'){SET.voice=t.value;save(['set'])}
 if(t.id==='rateIn'){SET.rate=+t.value;save(['set'])}
 if(t.id==='pinIn'){const v=t.value.replace(/\D/g,'').slice(0,4);if(v&&v.length!==4){toast('الرمز يجب أن يتكون من 4 أرقام');return}SET.pin=v;save(['set']);toast(v?'تم حفظ الرمز':'أُلغي الرمز')}
 if(t.id==='importIn'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!j||j.app!=='jumlati')throw 0;
   USER=j.user||USER;SET=Object.assign(SET,j.set||{});FAVS=j.favs||[];HIST=j.hist||[];save();rebuild();go({t:'home'});toast('تم استرجاع النسخة')}catch(er){toast('هذا الملف ليس نسخة احتياطية من التطبيق')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='pinChk')document.querySelector('[data-pinok]').click()});
function exportData(){
 try{const b=new Blob([JSON.stringify({app:'jumlati',v:1,at:new Date().toISOString(),user:USER,set:SET,favs:FAVS,hist:HIST})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jumlati-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('جارٍ تنزيل النسخة الاحتياطية')}
 catch(e){toast('التنزيل غير متاح في هذه النافذة')}
}

/* ---------------- boot ---------------- */
(async function(){
 await Store.open();
 const u=await Store.get('user'), s=await Store.get('set'), f=await Store.get('favs'), hh=await Store.get('hist');
 const first=!s;
 if(u)USER=Object.assign({items:{},groups:{},usage:{}},u); if(s)SET=Object.assign(SET,s); if(f)FAVS=f; if(hh)HIST=hh;
 rebuild();
 if(first){ // example sentence on first launch
  ST={who:'p0',act:'v_drink',obj:'n_water',where:'l_kitchen',when:'t_now'};STACK=['who','act','obj','where','when'];
  FAVS=[{st:{who:'p0',act:'v_want',obj:'n_water'},order:ORDER.slice(),at:Date.now()},{st:{who:'f3',act:'i_bring',obj:'n_med',when:'t_ameal'},order:ORDER.slice(),at:Date.now()},{st:{act:'v_hurts',obj:'b_head'},order:ORDER.slice(),at:Date.now()},{st:{act:'v_go',where:'l_wc'},order:ORDER.slice(),at:Date.now()}];
  save();
 }
 render();
 if('serviceWorker' in navigator&&location.protocol==='https:'&&document.querySelector('link[rel=manifest]')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
})();
</script>
